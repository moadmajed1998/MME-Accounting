name: Build MME APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q MME_Android_Project.zip

      - name: Apply latest MME screens and Android printing
        run: |
          cp index.html MME_Android_Project/app/src/main/assets/index.html
          cp MainActivity.java MME_Android_Project/app/src/main/java/com/mme/accounting/MainActivity.java
          mkdir -p MME_Android_Project/app/src/main/assets/icons
          cp icon-192.png MME_Android_Project/app/src/main/assets/icons/icon-192.png
          cp icon-512.png MME_Android_Project/app/src/main/assets/icons/icon-512.png

      - name: Build APK
        working-directory: MME_Android_Project
        run: gradle assembleDebug

      - name: Rename APK
        run: cp MME_Android_Project/app/build/outputs/apk/debug/app-debug.apk MME_Accounting.apk

      - name: Verify APK size
        run: |
          test -s MME_Accounting.apk
          ls -lh MME_Accounting.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MME_Accounting_1_3
          path: MME_Accounting.apk
