name: Build barq Android APK
on:
  push:
    branches: [barq-app]
    paths:
      - 'barq-android/**'
      - '.github/workflows/barq-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: barq-android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barq-android-apk
          path: barq-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
